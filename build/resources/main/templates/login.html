<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - OAuth2 Demo</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 420px;
        }
        .login-card h2 {
            margin: 0 0 10px 0;
            color: #333333;
            text-align: center;
            font-size: 26px;
        }
        .login-card p.subtitle {
            color: #777777;
            text-align: center;
            margin: 0 0 25px 0;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #444444;
            font-size: 14px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #667eea;
        }
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 5px;
        }
        .btn-submit:hover {
            opacity: 0.92;
        }
        .alert-error {
            background-color: #fde8e8;
            color: #9b1c1c;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            border: 1px solid #f8b4b4;
        }
        .card-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
            font-size: 14px;
            color: #666;
        }
        .card-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .card-footer a:hover {
            text-decoration: underline;
        }
        .sso-divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }
        .sso-divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #eee;
            z-index: 1;
        }
        .sso-divider span {
            background: white;
            padding: 0 10px;
            position: relative;
            z-index: 2;
            color: #999;
            font-size: 12px;
        }
        .btn-sso {
            display: block;
            width: 100%;
            padding: 11px;
            background: #f8f9fa;
            color: #495057;
            text-align: center;
            text-decoration: none;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn-sso:hover {
            background: #e9ecef;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Đăng Nhập</h2>
    <p class="subtitle">Đăng nhập tài khoản bảo mật qua Keycloak</p>

    <div th:if="${error != null}" class="alert-error" th:text="${error}">
        Lỗi đăng nhập
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Tên đăng nhập (Username)</label>
            <input type="text" id="username" name="username" th:value="${username}" placeholder="Nhập username" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Mật khẩu (Password)</label>
            <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
        </div>

        <button type="submit" class="btn-submit">Đăng Nhập</button>
    </form>

    <div class="sso-divider">
        <span>HOẶC</span>
    </div>

    <a th:href="@{/oauth2/authorization/keycloak}" class="btn-sso">
        🌐 Đăng nhập qua Keycloak SSO Portal
    </a>

    <div class="card-footer">
        Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a>
    </div>
</div>

</body>
</html>
