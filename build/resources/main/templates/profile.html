<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Profile - OAuth2 Keycloak Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 40px;
            background-color: #f4f6f9;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            margin: 0 auto;
        }

        h1,
        h2 {
            color: #333;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            color: white;
            background-color: #007bff;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        th,
        td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #ddd;
            word-break: break-all;
        }

        th {
            background-color: #f8f9fa;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Thông tin tài khoản (Profile)</h1>

        <h2>Thông tin cơ bản</h2>
        <table>
            <tr>
                <th style="width: 30%;">Thuộc tính</th>
                <th>Giá trị</th>
            </tr>
            <tr>
                <td>Họ và tên</td>
                <td th:text="${name}">N/A</td>
            </tr>
            <tr>
                <td>Username</td>
                <td th:text="${username}">N/A</td>
            </tr>
            <tr>
                <td>Email</td>
                <td th:text="${email}">N/A</td>
            </tr>
            <tr>
                <td>Roles</td>
                <td>
                    <span th:if="${roles != null and !roles.isEmpty()}">
                        <span th:each="r : ${roles}" th:text="${r}"
                            style="display: inline-block; background: #e3f2fd; color: #0d47a1; padding: 4px 8px; border-radius: 4px; margin-right: 5px; font-weight: 600; font-size: 13px;">user</span>
                    </span>
                    <span th:if="${roles == null or roles.isEmpty()}" style="color: #888;">Không có role</span>
                </td>
            </tr>
        </table>

        <style>
            .dashboard-link {
                display: block;
                padding: 16px 20px;
                margin-bottom: 12px;
                border-radius: 6px;
                text-decoration: none;
                transition: all 0.2s ease;
                border: 1px solid #e0e0e0;
            }

            .dashboard-link:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            }

            .dashboard-user {
                background-color: #f8f9fa;
                border-color: #e9ecef;
            }

            .dashboard-manager {
                background-color: #f0f7ff;
                border-color: #cce5ff;
            }

            .dashboard-admin {
                background-color: #fff5f5;
                border-color: #ffc9c9;
            }

            .dashboard-title {
                font-weight: bold;
                font-size: 16px;
                color: #212529;
                margin-bottom: 4px;
            }

            .dashboard-desc {
                font-size: 13px;
                color: #6c757d;
            }

            .btn-logout {
                width: 100%;
                padding: 12px;
                background-color: #e00000;
                color: white;
                border: none;
                border-radius: 6px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                transition: background-color 0.2s ease;
            }

            .btn-logout:hover {
                background-color: #c00000;
            }
        </style>

        <div style="margin-top: 30px;">
            <a sec:authorize="hasAnyRole('USER', 'user')" th:href="@{/user}" class="dashboard-link dashboard-user">
                <div class="dashboard-title">User Dashboard</div>
                <div class="dashboard-desc">Only User Access</div>
            </a>

            <a sec:authorize="hasAnyRole('MANAGE', 'MANAGER', 'manage', 'manager')" th:href="@{/manage}" class="dashboard-link dashboard-manager">
                <div class="dashboard-title">Manager Dashboard</div>
                <div class="dashboard-desc">Only Manager Access</div>
            </a>

            <a sec:authorize="hasAnyRole('ADMIN', 'admin')" th:href="@{/admin}" class="dashboard-link dashboard-admin">
                <div class="dashboard-title">Admin Dashboard</div>
                <div class="dashboard-desc">Only Admin Access</div>
            </a>

            <form th:action="@{/logout}" method="post" style="margin-top: 15px;">
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
    </div>
</body>

</html>
