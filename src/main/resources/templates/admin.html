<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - OAuth2 Keycloak Demo</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f4f6f9; }
        .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; border-top: 4px solid #dc3545; }
        h1 { color: #dc3545; }
        .btn { display: inline-block; padding: 10px 20px; color: white; background-color: #6c757d; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; font-size: 14px; margin-top: 15px; }
        .btn:hover { background-color: #5a6268; }
    </style>
</head>
<body>
<div class="card">
    <h1>Trang Quản Trị Hệ Thống (Admin)</h1>
    <p>Chào mừng <strong th:text="${username}">Admin</strong> đến với trung tâm quản trị tối cao.</p>
    <p>Bạn có toàn quyền truy cập cấu hình hệ thống, quản lý tài khoản và phân quyền.</p>
    <a class="btn" th:href="@{/profile}">Quay lại Profile</a>
</div>
</body>
</html>
